apply plugin: 'com.android.library'

apply from: "${rootDir}/gradle/android_general.gradle"

android {
    namespace 'wtf.uhoh.newsoftkeyboard.engine.neural'

    // The shared config forces ANDROIDX_TEST_ORCHESTRATOR, which clears app data and uninstalls the
    // test APK around each test — wiping the multi-MB model we stage in the app's external files
    // dir. This module's single on-device benchmark stages the model out-of-band, so run it HOST
    // (no per-test data clearing). No isolation is lost: there is one instrumentation test here.
    testOptions {
        execution 'HOST'
    }
}

dependencies {
    api project(':ime:base')
    api project(':engine-models')
    api project(':engine-core')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation project(':ime:base-test')
    // Host (Robolectric) execution of the neural tests needs ONNX Runtime's desktop native lib; the
    // -android artifact only ships Android .so files. Gated behind -PneuralHostOrt so the default
    // unit-test classpath is unchanged (tests then skip via isOnnxRuntimeAvailable()).
    if (project.hasProperty('neuralHostOrt')) {
        testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.19.2'
    }

    // On-device instrumentation: real onnxruntime-android .so + XNNPACK on the device. Used by the
    // warm per-keystroke latency benchmark (connectedDebugAndroidTest). See PathB docs in the test.
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestUtil 'androidx.test:orchestrator:1.4.2'
}

def skipNeuralModel = project.hasProperty('skipNeuralModel') || System.getenv('SKIP_NEURAL_MODEL')
def neuralModelUrl = project.findProperty('neuralModelUrl')
if (!neuralModelUrl) {
    neuralModelUrl = System.getenv("NEURAL_MODEL_URL")
}
if (!neuralModelUrl && !skipNeuralModel) {
    neuralModelUrl = 'https://fdroid.uh-oh.wtf/models/distilgpt2_mixedcase_sanity_v1.zip'
}

def neuralModelDir = file("$buildDir/neural_test_model")

tasks.register('fetchNeuralTestModel') {
    onlyIf { neuralModelUrl && !skipNeuralModel }
    outputs.dir(neuralModelDir)
    doLast {
        neuralModelDir.mkdirs()
        def zipFile = file("$buildDir/neural_test_model.zip")
        if (zipFile.exists()) {
            zipFile.delete()
        }
        ant.get(src: neuralModelUrl, dest: zipFile, verbose: false, usetimestamp: true)
        ant.unzip(src: zipFile, dest: neuralModelDir, overwrite: true)
    }
}

tasks.withType(Test).configureEach { task ->
    if (neuralModelUrl && !skipNeuralModel) {
        task.dependsOn tasks.named('fetchNeuralTestModel')
        task.systemProperty 'NEURAL_MODEL_DIR', neuralModelDir.absolutePath
        task.environment 'NEURAL_MODEL_DIR', neuralModelDir.absolutePath
    }
}
